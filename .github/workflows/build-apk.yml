name: Build TeDevo Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Configurar Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: 5. Compilar aplicação Web (Vite)
        run: npm run build

      - name: 6. Sincronizar Capacitor Android
        run: |
          npx cap sync android

      - name: 7. Conceder permissão de execução ao Gradle
        run: |
          chmod +x android/gradlew

      - name: 8. Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --info --stacktrace --no-daemon

      - name: 9. Salvar APK gerado como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: tedevo-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
