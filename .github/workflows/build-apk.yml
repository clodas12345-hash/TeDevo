name: Build TeDevo Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. Configurar Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: 5. Compilar aplicação Web (Vite)
        run: npm run build

      - name: 6. Inicializar e sincronizar Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

          # Sobrescrever variáveis do Capacitor para forçar SDK 35 estável
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '14.0.0'
          }
          EOF

          # Corrigir compileSdk diretamente no build.gradle da lib capacitor se necessário
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle || true

          # Garantir colors.xml para AAPT2
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#059669</color>
              <color name="colorPrimaryDark">#047857</color>
              <color name="colorAccent">#10b981</color>
          </resources>
          EOF

          # Garantir google-services.json falso para evitar erro do plugin
          if [ ! -f "android/app/google-services.json" ]; then
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "tedevo-app",
              "storage_bucket": "tedevo-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:tedevo000000000",
                  "android_client_info": {
                    "package_name": "com.tedevo.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForTedevoAppBuild0000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: 7. Permissão de execução e SDKs
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" || true
          chmod +x android/gradlew

      - name: 8. Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 9. Salvar APK gerado como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: tedevo-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
