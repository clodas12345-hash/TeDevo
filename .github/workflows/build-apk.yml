name: Build TeDevo Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5. Instalar dependências npm
        run: npm install --legacy-peer-deps

      - name: 6. Compilar aplicação Web (Vite)
        run: npm run build

      - name: 7. Inicializar e sincronizar Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 8. Garantir permissões completas no AndroidManifest.xml
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml já configurado com permissões de agenda, notificações, câmera, microfone e arquivos."
          fi

      - name: 9. Conceder permissão de execução ao Gradle Wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 10. Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 11. Salvar APK gerado como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: tedevo-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
